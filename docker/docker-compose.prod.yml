version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - app-network

  user-service:
    image: 542551366580.dkr.ecr.us-east-1.amazonaws.com/user-service:${IMAGE_TAG}
    container_name: user-service
    restart: unless-stopped
    environment:
      - PORT=5001
      - NODE_ENV=production
    networks:
      - app-network

  product-service:
    image: 542551366580.dkr.ecr.us-east-1.amazonaws.com/product-service:${IMAGE_TAG}
    container_name: product-service
    restart: unless-stopped
    environment:
      - PORT=5002
      - NODE_ENV=production
    networks:
      - app-network

  order-service:
    image: 542551366580.dkr.ecr.us-east-1.amazonaws.com/order-service:${IMAGE_TAG}
    container_name: order-service
    restart: unless-stopped
    environment:
      - PORT=5003
      - NODE_ENV=production
    networks:
      - app-network
